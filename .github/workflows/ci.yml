# Every push and pull request: everything builds (types included), the tests pass, and no dependency is copyleft.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      # Contest rule (CADEV Art. 6): GPL, AGPL and LGPL make the project inadmissible.
      - run: npm run licences:check
